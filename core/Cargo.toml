[package]
name = "cea608-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "cea608_core"

# The 608 code tables and the cc_data writer are Matthew Waters' crates,
# the ones gst-plugins-rs's closedcaption plugin is built on. The NAL and
# SEI splice is ffrwd-nal, shared with the other ffrwd packages.
[dependencies]
cea608-types = "0.1.5"
cea708-types = "0.4.1"
ffrwd-nal = { git = "https://github.com/imbcmdth/ffrwd-nal", tag = "v0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
